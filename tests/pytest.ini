# Configuration file for running the tests, which run the `unref` command.

[pytest]
# Execution options.
addopts =
    # Show slowest tests.
    --durations=5

    # Stop after X failures.
    --maxfail=5

    # Run verbose, useful for seeing full assert information.
    -v

    # The test cases are data for `tests/test_cases.py`, not test modules.
    --ignore=tests/cases
