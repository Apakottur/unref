# Configuration file for running unit tests with coverage measurement.
# References:
# 1. https://pytest-cov.readthedocs.io/en/latest/config.html
# 2. https://coverage.readthedocs.io/en/latest/config.html

[pytest]
# Execution options.
addopts =
    # Show slowest tests.
    --durations=5

    # Stop after X failures.
    --maxfail=5

    # Coverage configuration
    --cov-branch
    --cov-config=tests/coverage.toml
    --cov=src/unref
    --cov-report=term-missing:skip-covered
    --no-cov-on-fail
    --cov-fail-under=100

    # Run verbose, useful for seeing full assert information.
    -v

# The test cases are data for `tests/test_cases.py`, not test modules.
# Setting this replaces the defaults of pytest, so the relevant ones are repeated here.
norecursedirs = .* build dist venv cases
