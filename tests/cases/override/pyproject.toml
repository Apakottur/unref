[tool.unref]
# The overrides below stand in for the built-in rules of pytest, which are turned off.
frameworks = []
used-names = ["everywhere_*"]

[[tool.unref.overrides]]
paths = ["tests", "conftest.py"]
used-names = ["test_*"]
used-decorators = ["pytest.fixture"]

[[tool.unref.overrides]]
paths = ["tests/unit"]
used-names = ["Test*"]
