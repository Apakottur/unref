# The rules of Pydantic are turned off, to show what the overrides do on their own.
[tool.unref.frameworks]
pydantic = false

[[tool.unref.overrides]]
base-classes = ["pydantic.BaseModel"]
used-names = ["table_name"]

[[tool.unref.overrides]]
base-classes = ["typing.NamedTuple", "collections.abc.Mapping"]
used-names = ["*"]
used-decorators = ["register"]
