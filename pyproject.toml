[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.1",
  "prek==0.5.10",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-sugar==1.1.1",
  "ruff==0.17.4",
  "shpyx==1.0.0",
  "ty==0.0.101",
]
docs = [
  #
  "mkdocstrings-python==2.0.10",
  "zensical==0.1.1",
]

[project]
name = "unref"
dynamic = ["version"]
description = "Find unreferenced Python code"
authors = [{ name = "Yossi Rozantsev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["dead-code", "unused-code", "linter", "static-analysis"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  #
  "pathspec>=0.12",
  "typer>=0.15.4",
]

[project.scripts]
unref = "unref._cli:app"

[project.urls]
homepage = "https://github.com/Apakottur/unref"
repository = "https://github.com/Apakottur/unref"
documentation = "https://unref.readthedocs.io/"

[tool.hatch.version]
source = "vcs"

[tool.uv]
package = true
