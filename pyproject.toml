[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9,<2.0"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.1",
  "prek==0.5.11",
  "pytest==9.2.0",
  "ruff==0.17.5",
  "shpyx==1.0.2",
  "ty==0.0.107",
  "typer==0.29.2",
]
docs = [
  #
  "zensical==0.1.2",
]

[project]
name = "unref"
dynamic = ["version"]
description = "An extremely fast Python dead code finder, written in Rust."
authors = [{ name = "Yossi Rozantsev" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["dead-code", "unused-code", "linter", "static-analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
]

[project.urls]
homepage = "https://github.com/Apakottur/unref"
repository = "https://github.com/Apakottur/unref"
documentation = "https://unref.readthedocs.io/"

[tool.maturin]
# The wheel holds the `unref` binary only, as ruff's does.
bindings = "bin"
strip = true

[tool.uv]
package = true
# Build with the local profile of Cargo.toml.
config-settings = { build-args = "--profile=local" }
# Rebuild the binary when its source changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "src/**/*.rs" },
]

[tool.uv.dependency-groups]
# Our own scripts and tools run on Python 3.15, whose default encoding is UTF-8 on Windows too. Users of unref only
# need the requires-python of the project.
dev = { requires-python = ">=3.15" }
docs = { requires-python = ">=3.15" }
