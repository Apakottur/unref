# Read the Docs build: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  # Read the Docs does not offer Python 3.15 yet, so its Python only installs uv, which installs 3.15.
  tools:
    python: "3.14"
  jobs:
    install:
      - pip install uv
      - uv sync --frozen --only-group docs --python 3.15
    build:
      html:
        - uv run --no-sync zensical build --strict
        - mkdir -p "$READTHEDOCS_OUTPUT/html/"
        - cp --recursive site/* "$READTHEDOCS_OUTPUT/html/"
