# See: https://unref.readthedocs.io/en/latest/configuration/
# As with ruff, the paths are relative to the current directory, which is the root of the repository.

# The test cases are small projects that are unused on purpose.
exclude = ["tests/cases"]
used-decorators = ["app.command"]

[[overrides]]
paths = ["tests"]
used-names = ["test_*"]
