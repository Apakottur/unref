[package]
name = "unref"
# The release workflow sets the version from the tag that it releases.
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
description = "An extremely fast Python dead code finder, written in Rust."
license = "MIT"
repository = "https://github.com/Apakottur/unref"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8.44"
fancy-regex = "0.20"
ignore = "0.4.34"
# v2, as v3 holds about a third more memory when many threads check.
mimalloc = { version = "0.1.52", features = ["v2"] }
rayon = "1.12"
regex = "1.13"
rustc-hash = "2.1.3"
toml = { version = "1.2", features = ["preserve_order"] }

# Ruff's crates are not published on crates.io, so they are pinned to a release of Ruff.
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.5" }

# As ruff's.
[profile.release]
lto = "fat"
codegen-units = 16

# For the builds of uv, which skip LTO to rebuild in seconds. The binary runs about 10 to 15% slower.
[profile.local]
inherits = "release"
lto = "off"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# The documentation names frameworks and Python names in prose, such as SQLAlchemy and TypedDict.
doc_markdown = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
# Restriction and nursery lints, as ruff's.
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
rest_pat_in_fully_bound_structs = "warn"
unused_peekable = "warn"
