name: Other
description: A question, a documentation fix or anything else.
labels: ["triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `unref --version`.
    validations:
      required: true

  - type: checkboxes
    id: contributing
    attributes:
      label: Contributing
      options:
        - label: >-
            I have read the
            [issue guidelines](https://github.com/Apakottur/unref/blob/main/CONTRIBUTING.md#issues-and-pull-requests).
          required: true
