name: Bug report
description: A false positive, a missed finding, a crash or other wrong behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The smallest project that shows the bug helps the most: a few short files, the configuration
        and the command. For a public project, a link to it is enough.

  - type: input
    id: project
    attributes:
      label: Project
      description: A link to the project, with the commit, if it is public.

  - type: textarea
    id: files
    attributes:
      label: Files
      description: The Python files and the configuration file, if any, each with its path. Not needed with a link.
      placeholder: |
        `main.py`:
        ```python

        ```

        `pyproject.toml`:
        ```toml
        [tool.unref]

        ```

  - type: input
    id: command
    attributes:
      label: Command
      value: unref .
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Command output
      description: What the command printed.
      render: text
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Which findings are wrong or missing, or what else should have happened.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `unref --version`.
    validations:
      required: true

  - type: checkboxes
    id: contributing
    attributes:
      label: Contributing
      options:
        - label: >-
            I have read the
            [issue guidelines](https://github.com/Apakottur/unref/blob/main/CONTRIBUTING.md#issues-and-pull-requests).
          required: true
