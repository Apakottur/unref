name: Feature request
description: A missing framework, option or rule.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is missing, and what `unref` should do. For a framework, link its documentation.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Example
      description: >-
        A few short files that use the feature and the configuration file, if any, each with its path,
        and what `unref` should report.
      placeholder: |
        `main.py`:
        ```python

        ```

        `pyproject.toml`:
        ```toml
        [tool.unref]

        ```

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `unref --version`.
    validations:
      required: true

  - type: checkboxes
    id: contributing
    attributes:
      label: Contributing
      options:
        - label: I have read [CONTRIBUTING.md](https://github.com/Apakottur/unref/blob/main/CONTRIBUTING.md).
          required: true
