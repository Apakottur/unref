name: Feature request
description: A missing framework, option or rule.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is missing, and what `unref` should do. For a framework, link its documentation.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Example
      description: A few short files that use the feature, each with its path, and what `unref` should report.
      placeholder: |
        `main.py`:
        ```python

        ```

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `unref --version`.
