name: CI

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

# A new push to a PR supersedes its in-flight run; manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/workflows/util/setup_python

      - name: prek cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: ci-prek-cache-${{ hashFiles('prek.toml') }}

      - name: Run prek
        run: prek run -v --show-diff-on-failure --color=always --all-files

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: ./.github/workflows/util/setup_python

      - name: Build docs
        run: uv run --group docs zensical build --strict

  # The Python code is the tests and scripts, which run on one Python only, so one version is enough.
  type-check:
    name: Type Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The type checks read the Python code only, so they do not need the unref binary.
      - uses: ./.github/workflows/util/setup_python
        with:
          install-project: "false"

      - name: Run mypy
        run: mypy --config-file linters/mypy.toml .

      - name: Run ty
        run: ty check --project . --config-file linters/ty.toml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/workflows/util/setup_python

      - name: Run Rust unit tests
        run: cargo test --locked

      # The tests of the command run the unref that the setup installs in the environment.
      - name: Run tests of the command
        run: pytest --showlocals -c tests/pytest.ini

  check:
    name: Check All
    if: always()
    needs: [linters, docs, type-check, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
