name: CI

on:
  pull_request:
    branches: [main]

  # Saves the caches, which pull requests can read only from main.
  push:
    branches: [main]

  workflow_dispatch:

# A new push to a PR supersedes its in-flight run; manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/workflows/util/setup_python

      - name: Restore the prek cache
        id: prek-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: ci-prek-cache-${{ hashFiles('prek.toml') }}

      - name: Run prek
        run: prek run -v --show-diff-on-failure --color=always --all-files

      # Only main saves caches, as each pull request would save its own copy.
      - name: Save the prek cache
        if: github.ref == 'refs/heads/main' && steps.prek-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: ${{ steps.prek-cache.outputs.cache-primary-key }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/workflows/util/setup_python
        with:
          install-project: "false"

      - name: Build docs
        run: |
          uv sync --frozen --no-install-project --group docs
          zensical build --strict

  type-check:
    name: Type Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/workflows/util/setup_python
        with:
          install-project: "false"

      - name: Run mypy
        run: mypy --config-file linters/mypy.toml .

      - name: Run ty
        run: ty check --project . --config-file linters/ty.toml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/workflows/util/setup_python

      - name: Run Rust unit tests
        run: cargo test --locked

      # The tests of the command run the unref that the setup installs in the environment.
      - name: Run tests of the command
        run: pytest --showlocals -c tests/pytest.ini

  # The oldest Rust that Cargo.toml supports, two releases behind the pinned toolchain, as ruff's.
  minimum-rust:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the minimum Rust version
        id: minimum
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: minimum-rust-${{ steps.minimum.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the tests
        env:
          RUST_VERSION: ${{ steps.minimum.outputs.version }}
        run: cargo "+$RUST_VERSION" test --locked --no-run

  compare:
    name: Compare with main
    runs-on: ubuntu-latest
    steps:
      # A pull request is checked out as its merge into the current main, which is the merge's first parent. The
      # base SHA of the event can be an older main, whose later commits would count as changes of the PR. A manual
      # run compares the branch it runs on with main. A push to main only builds the head, to save its caches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Checkout the base
        id: base
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ]; then
            base=HEAD^1
          else
            git fetch --depth=1 origin main
            base=FETCH_HEAD
          fi
          git worktree add --detach base "$base"
          git -C base log -1 --format='Base: %h %s'
          echo "sha=$(git -C base rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/workflows/util/setup_python
        with:
          install-project: "false"

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each push to main saves its binary, so that a pull request builds the base only when the run of its main
      # has not finished.
      - name: Restore the base
        id: restore-base
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: binary
          key: binary-${{ steps.base.outputs.sha }}

      - name: Build the head
        run: cargo build --release --locked

      - name: Build the base
        if: github.event_name != 'push' && steps.restore-base.outputs.cache-hit != 'true'
        run: |
          cargo build --release --locked --manifest-path base/Cargo.toml
          mkdir -p binary
          cp base/target/release/unref binary/

      - name: Copy the binary of main
        if: github.event_name == 'push'
        run: |
          mkdir -p binary
          cp target/release/unref binary/

      - name: Save the binary of main
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: binary
          key: binary-${{ github.sha }}

      # Shows the findings that the head adds or removes on open source projects. It never fails the job, not even
      # when a project cannot be cloned.
      - name: Compare the findings on open source projects
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/ecosystem.py binary/unref target/release/unref ecosystem.md

      # Fails when the head is too slow, after it writes its report, which the next steps then still post.
      - name: Compare the speed
        if: github.event_name != 'push'
        run: python scripts/benchmark.py compare binary/unref target/release/unref benchmark.md

      - name: Write the report and the job summary
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: |
          for file in benchmark.md ecosystem.md; do
            if [ -f "$file" ]; then cat "$file"; echo; fi
          done > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # This run has a read-only token, also for a pull request from a fork, so Publish Comparison posts the
      # report. The number tells it which pull request the report is for.
      - name: Save the pull request number
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          NUMBER: ${{ github.event.number }}
        run: echo "$NUMBER" > number

      - name: Upload the report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare-report
          path: |
            report.md
            number
          retention-days: 1

  check:
    name: Check All
    if: always()
    needs: [linters, docs, type-check, unit-tests, compare]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
