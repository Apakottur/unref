name: CI

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

# A new push to a PR supersedes its in-flight run; manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/workflows/util/setup_python

      - name: prek cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: ci-prek-cache-${{ hashFiles('prek.toml') }}

      - name: Run prek
        run: prek run -v --show-diff-on-failure --color=always --all-files

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/workflows/util/setup_python

      - name: Build docs
        run: uv run --group docs zensical build --strict

  type-check:
    name: Type Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/workflows/util/setup_python
        with:
          install-project: "false"

      - name: Run mypy
        run: mypy --config-file linters/mypy.toml .

      - name: Run ty
        run: ty check --project . --config-file linters/ty.toml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/workflows/util/setup_python

      - name: Run Rust unit tests
        run: cargo test --locked

      # The tests of the command run the unref that the setup installs in the environment.
      - name: Run tests of the command
        run: pytest --showlocals -c tests/pytest.ini

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A pull request is checked out as its merge into the current main, which is the merge's first parent. The
      # base SHA of the event can be an older main, whose later commits would count as changes of the PR. A manual
      # run compares the branch it runs on with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Checkout the base
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base=HEAD^1
          else
            git fetch --depth=1 origin main
            base=FETCH_HEAD
          fi
          git worktree add --detach base "$base"
          git -C base log -1 --format='Base: %h %s'

      - uses: ./.github/workflows/util/setup_python
        with:
          install-project: "false"

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            base -> target

      - name: Build the head and the base
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path base/Cargo.toml

      # Fails when the head is too slow, after it writes the report, which the next steps then still post.
      - name: Compare the head with the base
        run: python scripts/benchmark.py compare base/target/release/unref target/release/unref benchmark.md

      - name: Write the job summary
        if: ${{ !cancelled() && hashFiles('benchmark.md') != '' }}
        run: cat benchmark.md >> "$GITHUB_STEP_SUMMARY"

      # A pull request from a fork has a read-only token, so it gets the job summary only.
      - name: Comment on the pull request
        if: >-
          ${{ !cancelled() && hashFiles('benchmark.md') != '' && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: benchmark
          path: benchmark.md

  check:
    name: Check All
    if: always()
    needs: [linters, docs, type-check, unit-tests, benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
