name: Update Version

# Opens a pull request that points the docs and the benchmark at the latest release on PyPI, once it differs.
on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions: {}

jobs:
  update:
    name: Update the version
    if: github.repository == 'Apakottur/unref'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required to start CI on the pull request, as one opened with this token does not.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set the latest version
        run: uv run --no-project scripts/set_version.py

      - name: Open or update the pull request
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update-version
          commit-message: Point the docs and the benchmark at the latest release of unref
          title: Point the docs and the benchmark at the latest release of unref
          body: The docs and the benchmark name an older release than the latest on PyPI.

      - name: Start CI
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref update-version
