name: Benchmark

on:
  pull_request:
    branches: [main]

  # A manual run compares the branch it runs on with main.
  workflow_dispatch:

# A new push to a PR supersedes its in-flight run; manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    name: Compare with the base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A pull request is checked out as its merge into the current main, which is the merge's first parent. The
      # base SHA of the event can be an older main, whose later commits would count as changes of the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Checkout the base
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base=HEAD^1
          else
            git fetch --depth=1 origin main
            base=FETCH_HEAD
          fi
          git worktree add --detach base "$base"
          git -C base log -1 --format='Base: %h %s'

      - uses: ./.github/workflows/util/setup_python
        with:
          install-project: "false"

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            base -> target

      - name: Build the head and the base
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path base/Cargo.toml

      - name: Compare the head with the base
        run: python scripts/benchmark.py compare base/target/release/unref target/release/unref benchmark.md

      - name: Write the job summary
        run: cat benchmark.md >> "$GITHUB_STEP_SUMMARY"

      # A pull request from a fork has a read-only token, so it gets the job summary only.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: benchmark
          path: benchmark.md
