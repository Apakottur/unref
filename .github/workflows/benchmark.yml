name: Benchmark

on:
  pull_request:
    branches: [main]

  # A manual run compares the branch it runs on with main.
  workflow_dispatch:

# A new push to a PR supersedes its in-flight run; manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    name: Compare with the base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Checkout the base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base

      - uses: ./.github/workflows/util/setup_python
        with:
          install-project: "false"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            . -> target
            base -> target

      - name: Build the head and the base
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path base/Cargo.toml

      - name: Compare the head with the base
        run: python scripts/benchmark.py compare base/target/release/unref target/release/unref benchmark.md

      - name: Write the job summary
        run: cat benchmark.md >> "$GITHUB_STEP_SUMMARY"

      # A pull request from a fork has a read-only token, so it gets the job summary only.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: benchmark
          path: benchmark.md
