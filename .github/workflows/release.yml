name: Release

on:
  push:
    tags: ["v*"]

  workflow_dispatch:

# The wheels can be built from any branch by hand, but only a version tag is released.
jobs:
  wheels:
    strategy:
      # Every wheel is built, so that one failure shows whether the others build.
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, target: x86_64, manylinux: auto}
          - {runner: ubuntu-latest, target: aarch64, manylinux: auto}
          - {runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2}
          - {runner: ubuntu-latest, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2}
          - {runner: macos-latest, target: x86_64, manylinux: ""}
          - {runner: macos-latest, target: aarch64, manylinux: ""}
          - {runner: windows-latest, target: x64, manylinux: ""}
          - {runner: windows-latest, target: aarch64, manylinux: ""}

    name: Wheel - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      # The git command line fetches Ruff's crates, as it can check out the paths of Ruff's repository that
      # are longer than Windows allows by default.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Allow long paths in git on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sed -i.bak "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" Cargo.toml

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" Cargo.toml

      - name: Build the source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Release
    needs: [wheels, sdist]
    runs-on: ubuntu-latest

    permissions:
      # Required for PyPI Trusted Publishing (OIDC), so no API token is stored.
      id-token: write
      # Required to create the GitHub Release.
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: dist/*
