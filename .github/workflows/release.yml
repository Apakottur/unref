name: Release

on:
  push:
    tags: ["v*"]

  workflow_dispatch:

# Jobs that need more ask for it themselves.
permissions:
  contents: read

# The wheels can be built from any branch by hand, but only a version tag is released.
jobs:
  wheels:
    strategy:
      # Every wheel is built, so that one failure shows whether the others build.
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, target: x86_64, manylinux: auto}
          # jemalloc on aarch64 Linux takes pages of up to 64 KiB, which some kernels use, as ruff's.
          - {runner: ubuntu-latest, target: aarch64, manylinux: auto, docker-options: -e JEMALLOC_SYS_WITH_LG_PAGE=16}
          - {runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2}
          - {runner: ubuntu-latest, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2}
          - {runner: macos-latest, target: x86_64, manylinux: ""}
          - {runner: macos-latest, target: aarch64, manylinux: ""}
          - {runner: windows-latest, target: x64, manylinux: ""}
          - {runner: windows-latest, target: aarch64, manylinux: ""}

    name: Wheel - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      # The git command line fetches Ruff's crates, as it can check out the paths of Ruff's repository that
      # are longer than Windows allows by default.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Allow long paths in git on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        if: startsWith(github.ref, 'refs/tags/v')
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The README is the page of the release on PyPI, so its pre-commit example is set too.
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: uv run --only-group dev scripts/set_version.py "${GITHUB_REF_NAME#v}"

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: ${{ matrix.docker-options }}
          args: --release --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        if: startsWith(github.ref, 'refs/tags/v')
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run --only-group dev scripts/set_version.py "${GITHUB_REF_NAME#v}"

      - name: Build the source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Release
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      # Required for PyPI Trusted Publishing (OIDC), so no API token is stored.
      id-token: write
      # Required to create the GitHub Release.
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*

  # Opens a pull request that points the docs, the benchmark and the package at the release, once PyPI serves it.
  update-version:
    name: Update the version
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required to start CI on the pull request, as one opened with this token does not.
      actions: write
    steps:
      - name: Wait for the release on PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 60); do
            if curl --fail --silent --show-error --output /dev/null "https://pypi.org/pypi/unref/$version/json"; then
              exit 0
            fi
            sleep 10
          done
          echo "unref $version is not on PyPI after 10 minutes."
          exit 1

      # The pull request is opened against main, not the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set the version from the tag
        run: uv run --only-group dev scripts/set_version.py "${GITHUB_REF_NAME#v}"

      - name: Open or update the pull request
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update-version
          commit-message: Point the docs, the benchmark and the package at the latest release of unref
          title: Point the docs, the benchmark and the package at the latest release of unref
          body: The docs, the benchmark and the package name an older release than the latest on PyPI.

      - name: Start CI
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref update-version
