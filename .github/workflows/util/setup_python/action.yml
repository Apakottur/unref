name: Setup Python
description: Install Python, uv and dependencies, which builds unref unless asked not to.

inputs:
  python-version:
    description: Python version to install.
    default: "3.14"
  install-project:
    description: Whether to build and install unref. Jobs that only check the Python code do not need it.
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    # The Rust toolchain of the runner builds unref, whose build is cached.
    - name: Rust cache
      if: inputs.install-project == 'true'
      uses: Swatinem/rust-cache@v2.9.3

    - name: Install Python dependencies
      shell: bash
      env:
        INSTALL_PROJECT: ${{ inputs.install-project }}
      run: |
          if [ "$INSTALL_PROJECT" = "true" ]; then
            uv sync --frozen
          else
            uv sync --frozen --no-install-project
          fi

    # Put the project virtual environment on PATH for subsequent steps, so tools can be
    # invoked directly (e.g. `pytest`).
    - name: Activate Python venv
      shell: bash
      run: echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
