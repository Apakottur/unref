- id: unref
  name: unref
  description: Find unreferenced Python code.
  entry: unref
  # The hook is built from the source of the repository with Cargo, which pre-commit and prek install if
  # it is missing.
  language: rust
  types: [python]
  # Finding unused code needs the whole project, not only the changed files.
  pass_filenames: false
