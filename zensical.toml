[project]
site_name = "unref"
site_description = "An extremely fast Python dead code finder, written in Rust."
site_url = "https://unref.readthedocs.io/"
repo_name = "Apakottur/unref"
repo_url = "https://github.com/Apakottur/unref"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
strict = true
nav = [
  { "Home" = "index.md" },
  { "Rules" = "rules.md" },
  { "Configuration" = "configuration.md" },
  { "FAQ" = "faq.md" },
]

[project.theme]
features = ["content.code.copy", "navigation.footer", "toc.follow"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
pymdownx.highlight = {}
pymdownx.superfences = {}
toc.permalink = true
